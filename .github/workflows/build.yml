name: build

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt pyinstaller

      - name: Build exe
        # 注意：不要加 --specpath，否则 --icon / --add-data 会按 spec 目录解析相对路径而找不到文件
        run: |
          python -m PyInstaller --noconfirm --windowed --name ScreenQRScanner `
            --icon "$env:GITHUB_WORKSPACE\assets\icon.ico" `
            --add-data "$env:GITHUB_WORKSPACE\assets\icon.ico;assets" `
            --distpath dist --workpath build qr_scanner.py

      - name: Build portable single-file exe
        run: |
          python -m PyInstaller --noconfirm --onefile --windowed --name ScreenQRScanner-portable `
            --icon "$env:GITHUB_WORKSPACE\assets\icon.ico" `
            --add-data "$env:GITHUB_WORKSPACE\assets\icon.ico;assets" `
            --distpath dist --workpath build_portable qr_scanner.py

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ScreenQRScanner-windows
          path: |
            dist/ScreenQRScanner
            dist/ScreenQRScanner-portable.exe

      - name: Zip for release
        if: startsWith(github.ref, 'refs/tags/')
        run: Compress-Archive -Path dist/ScreenQRScanner/* -DestinationPath ScreenQRScanner.zip

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ScreenQRScanner.zip
            dist/ScreenQRScanner-portable.exe
          body: |
            ## 下载哪个？

            | 文件 | 说明 |
            | --- | --- |
            | `ScreenQRScanner-portable.exe` | **推荐**。单文件免安装，下载后双击即用，无需解压 |
            | `ScreenQRScanner.zip` | 解压后用 `ScreenQRScanner.exe`，启动更快（需保持 `_internal` 同目录） |

            两种都是纯本地运行，不联网、不上传图片。
