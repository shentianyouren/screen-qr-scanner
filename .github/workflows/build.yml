name: build

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt pyinstaller

      - name: Build exe
        run: |
          pyinstaller --noconfirm --windowed --name ScreenQRScanner `
            --icon assets/icon.ico `
            --add-data "assets/icon.ico;assets" `
            --distpath dist --workpath build --specpath build qr_scanner.py

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ScreenQRScanner-windows
          path: dist/ScreenQRScanner

      - name: Zip for release
        if: startsWith(github.ref, 'refs/tags/')
        run: Compress-Archive -Path dist/ScreenQRScanner/* -DestinationPath ScreenQRScanner.zip

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: ScreenQRScanner.zip
